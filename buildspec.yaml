version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo Installing dependencies...
      - npm install
  pre_build:
    commands:
      - echo API Gateway URL is $VITE_API_GATEWAY_URL
  build:
    commands:
      - echo Building the app...
      - npm run build
  post_build:
    commands:
      - echo Build completed on $(date)
      - echo Invalidating CloudFront cache...
      - aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"

artifacts:
  files:
    - '**/*'
  base-directory: dist